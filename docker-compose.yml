# The whole product on one box: TLS, the static frontend, the API, and Postgres.
#
#   caddy ──▶ api ──▶ db
#     └──▶ ./web  (the marketing site at /, the app at /app/)
#
# Everything the free-tier plan gave up is back here — OCR runs, the full 1.7 GB
# corpus fits, the disk persists, nothing sleeps, and the ingestion agents can be
# scheduled. See DEPLOY.md.
#
#   docker compose up -d           bring it up
#   docker compose logs -f api     watch a run
#   docker compose pull && docker compose up -d    what the deploy workflow runs

name: itqan

services:
  db:
    # pgvector's own image rather than postgres+extension: the vector type and
    # the HNSW indexes are load-bearing (course/posting embeddings, ESCO labels),
    # and this is the same image CI runs against, so "works in CI" means
    # something.
    image: pgvector/pgvector:pg16
    shm_size: "512mb"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itqan}
      POSTGRES_USER: ${POSTGRES_USER:-itqan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      # Pinned rather than left to grow. The box has 4 GB and OCR peaks at ~2 GB
      # of it, so Postgres taking whatever it likes is how a scanned upload gets
      # OOM-killed. 256 MB of shared buffers is comfortable for a 1.7 GB database
      # whose hot set is small; work_mem is raised because HNSW searches sort.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itqan} -d ${POSTGRES_DB:-itqan}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host. Only `api` needs it, and an exposed 5432 on a
    # public IP is found by scanners within hours.
    expose:
      - "5432"

  api:
    # In production this is the image the deploy workflow built and pushed; the
    # `build` block is the local-development path. `docker compose build` uses it,
    # `docker compose pull` ignores it.
    image: ${ITQAN_IMAGE:-ghcr.io/aminpatra/itqan-api:latest}
    build:
      context: .
      args:
        WITH_OCR: "1"
        # Chromium, for the employer pages the ingestion cron follows. Measured
        # on live destinations: 3 of the 6 that robots permits are unreadable to
        # httpx (an incomplete TLS chain, a 410 to non-browser clients) and
        # readable rendered. Without it the crawl still runs — `root_fetch`
        # falls back to httpx and says so — it just learns less.
        WITH_BROWSER: "1"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ITQAN_ENV: production
      ITQAN_DATABASE_URL: postgresql://${POSTGRES_USER:-itqan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-itqan}
      ITQAN_SESSION_SECRET: ${ITQAN_SESSION_SECRET:?generate with python -c "import secrets;print(secrets.token_hex(32))"}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      # Who the crawler says it is. REQUIRED for any live ingestion: the config
      # refuses to make a request while this still contains
      # "contact-not-configured", so without it Agent B and Agent D fail closed
      # on every cycle with "ITQAN_USER_AGENT has no contact address".
      #
      # It was in .env.example from the start and never passed through to the
      # container, so the scheduled crawl could not run on the box at all — the
      # guard worked exactly as designed and reported it, which is the only
      # reason this was ever noticed rather than silently crawling anonymously.
      #
      # `:?` rather than a default: an unattended crawler that cannot be
      # contacted by the sites it visits should stop the deploy, not start.
      ITQAN_USER_AGENT: ${ITQAN_USER_AGENT:?set ITQAN_USER_AGENT in .env, e.g. "ItqanJobBot/1.0 (+you@example.com)"}
      ITQAN_OUTPUT_DIR: /data/output
      # Password recovery. `:?` on the host for the same reason the two above
      # have it: the API refuses to boot in production without a relay, because
      # forgot-password answers 200 whether or not the address has an account —
      # so with no relay it would accept every request, send nothing, and give
      # nobody any way to notice. Failing the deploy is the loud version.
      ITQAN_SMTP_HOST: ${ITQAN_SMTP_HOST:?set ITQAN_SMTP_HOST in .env}
      ITQAN_SMTP_PORT: ${ITQAN_SMTP_PORT:-587}
      ITQAN_SMTP_USER: ${ITQAN_SMTP_USER:-}
      ITQAN_SMTP_PASSWORD: ${ITQAN_SMTP_PASSWORD:-}
      ITQAN_SMTP_FROM: ${ITQAN_SMTP_FROM:-}
      # Where the emailed reset link points — the SITE, which owns the
      # forgot-password page, not this API's origin.
      ITQAN_SITE_URL: ${ITQAN_SITE_URL:?set ITQAN_SITE_URL in .env, e.g. https://itqan.example}

      # Developer accounts exempt from the assistant's quotas. Optional, and
      # empty by default so nobody is exempt unless the box says so.
      #
      # Listed here because THIS FILE ENUMERATES WHAT REACHES THE CONTAINER, and
      # a variable that exists only in .env silently does not — which is exactly
      # what happened to ITQAN_USER_AGENT above, where the crawler could not run
      # on the box at all until it was added here.
      ITQAN_UNLIMITED_EMAILS: ${ITQAN_UNLIMITED_EMAILS:-}

      # The model, and how it is reached. All optional: unset, the defaults in
      # shared/config.py apply and everything goes straight to OpenAI on the key
      # above. Passed through so a model can be changed on the box after a
      # bake-off without rebuilding an image, and so that pointing ITQAN_API_BASE
      # at a gateway actually works rather than being quietly ignored.
      ITQAN_MODEL: ${ITQAN_MODEL:-}
      ITQAN_REASONING_EFFORT: ${ITQAN_REASONING_EFFORT:-}
      ITQAN_MAX_OUTPUT_TOKENS: ${ITQAN_MAX_OUTPUT_TOKENS:-}
      ITQAN_API_BASE: ${ITQAN_API_BASE:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      # Uploads and per-run artifacts. A named volume rather than an anonymous
      # one so `up -d --build` keeps them: phase two reads a file phase one wrote,
      # and the wait between the two ends when a PERSON acts.
      - uploads:/data/output
    expose:
      - "8000"

  caddy:
    # The only thing on the public interface. Terminates TLS, obtains and renews
    # the Let's Encrypt certificate on its own, and proxies to `api`.
    #
    # Vercel rewrites /api/* here, so this MUST be HTTPS: the session cookie is
    # set Secure in production and a browser will not send it over http.
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # The hostname Caddy requests a certificate for — OVH's default
      # (vps-xxxx.vps.ovh.net) until there is a real domain.
      ITQAN_DOMAIN: ${ITQAN_DOMAIN:?set ITQAN_DOMAIN in .env}
    ports:
      - "80:80"     # required: Let's Encrypt HTTP-01 validation lands here
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The built frontend: the Astro site at the root, the React app under
      # /app/. Written by the frontend repo's deploy job (rsync over SSH), read
      # only here — 7.5 MB of static files, so there is no image or registry in
      # the loop for it.
      - ./web:/srv/web:ro
      - caddydata:/data      # the certificates. Losing these means re-issuing,
      - caddyconfig:/config  # and Let's Encrypt rate-limits that.

volumes:
  pgdata:
  uploads:
  caddydata:
  caddyconfig:
